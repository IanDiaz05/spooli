[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spooli"
version = "0.1.0"
description = "Lightweight command-line filament inventory and cost tracker for FDM 3D printing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IanDiaz05" }]
keywords = ["3d-printing", "filament", "gcode", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[tool.setuptools]
py-modules = ["core", "db", "parser", "menu", "install", "main"]
packages = ["spooli", "spooli.constants", "spooli.storage"]
